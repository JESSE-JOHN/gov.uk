<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Licence Records Dashboard</title>
  <style>
    /* ---- Core Vars ---- */
    :root {
      --gov-blue: #1d70b8;
      --gov-dark: #0b0c0c;
      --gov-light: #f3f2f1;
      --gov-yellow: #ffdd00;
      --gov-gray: #5a636e;
      --gov-red: #d4351c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "GDS Transport", Arial, sans-serif;
      background: var(--gov-light);
      color: var(--gov-dark);
      line-height: 1.5;
    }

    a { text-decoration: none; color: inherit; }

    /* ---- Auth Screen ---- */
    #auth-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--gov-blue); }
    #auth-card { background: #fff; border-radius: 4px; padding: 35px 30px; width: 100%; max-width: 420px; box-shadow: 0 2px 4px rgba(0,0,0,.1); text-align: center; }
    .lock-icon { text-align: center; font-size: 48px; color: var(--gov-blue); margin-bottom: 16px; }
    #auth-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #fff; }
    #auth-card .subtitle { font-size: 14px; color: rgba(255,255,255,.7); margin-bottom: 24px; }
    #password-input { width: 100%; padding: 12px 14px; border: 2px solid var(--gov-gray); border-radius: 3px; font-size: 16px; font-family: inherit; outline: none; transition: border-color .2s; }
    #password-input:focus { border-color: var(--gov-blue); }
    #submit-btn { width: 100%; padding: 12px; background: var(--gov-blue); color: #fff; border: none; border-radius: 3px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 16px; transition: background .2s; }
    #submit-btn:hover { background: #145a93; }
    .error-msg { color: var(--gov-red); font-size: 14px; margin-top: 10px; display: none; }
    .error-msg.visible { display: block; }

    /* ---- Main Dashboard ---- */
    #main-dash { display: none; }
    header { background: var(--gov-dark); color: #fff; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 22px; font-weight: 700; }
    header .badge { background: var(--gov-blue); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 3px; font-weight: 400; letter-spacing: .5px; }
    nav { background: var(--gov-dark); padding: 10px 30px; display: flex; gap: 6px; }
    nav a { color: #fff; text-decoration: none; padding: 6px 16px; border-radius: 2px; font-size: 14px; font-weight: 500; display: inline-block; }
    nav a.active { background: var(--gov-blue); }

    main { padding: 24px 30px; max-width: 1200px; margin: 0 auto; }

    /* ---- Toolbar ---- */
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .toolbar h2 { font-size: 18px; font-weight: 700; }
    .toolbar .stats { display: flex; gap: 20px; }
    .stat-box { background: #fff; border: 1px solid var(--gov-gray); border-radius: 3px; padding: 10px 18px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--gov-blue); }
    .stat-label { font-size: 12px; color: var(--gov-gray); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

    /* ---- Forms ---- */
    .form-card { background: #fff; border: 1px solid var(--gov-gray); border-radius: 3px; padding: 24px; margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-row { display: flex; flex-direction: column; gap: 6px; }
    .form-row.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 700; color: var(--gov-dark); text-transform: uppercase; letter-spacing: .4px; }
    label .hint { font-size: 12px; color: var(--gov-gray); font-weight: 400; }
    input, select, textarea {
      width: 100%; padding: 9px 10px; border: 2px solid var(--gov-gray); border-radius: 3px;
      font-size: 14px; font-family: inherit; outline: none; transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gov-blue); }
    textarea { resize: vertical; min-height: 50px; }

/* ---- Address autocomplete ---- */
.address-wrapper { position: relative; }
.address-wrapper input#address { position: relative; z-index: 2; }
.address-dropdown { position: absolute; top: 100%; left: 0; right: 0; border: 2px solid var(--gov-gray); border-top: none; border-radius: 0 0 3px 3px; background: #fff; max-height: 300px; overflow-y: auto; z-index: 1000; box-shadow: 0 2px 6px rgba(0,0,0,.15); display: none; }
.address-dropdown .addr-item { padding: 9px 12px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.address-dropdown .addr-item:hover { background: #e8f0fe; }
.address-dropdown .addr-item.selected { background: #cce5ff; }
.address-no-results { padding: 9px 12px; font-size: 14px; color: var(--gov-gray); border-bottom: 1px solid #eee; }
.address-wrapper input:focus ~ .address-dropdown { display: block; }
    button.primary { background: var(--gov-blue); color: #fff; border: none; border-radius: 3px; padding: 10px 28px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .2s; }
    button.primary:hover { background: #145a93; }
    button.secondary { background: var(--gov-gray); color: #fff; border: none; border-radius: 3px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background .2s; }
    button.secondary:hover { background: #666; }

    /* ---- Table ---- */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    th { background: var(--gov-blue); color: #fff; font-size: 13px; font-weight: 700; text-align: left; padding: 12px 14px; white-space: nowrap; }
    td { padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #e5e5e5; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f8f8; }
    tr.highlight td { background: #fffbe6; }
    tr.highlight:hover td { background: #fff6cc; }
    .actions { display: flex; gap: 6px; }
    .link-btn { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 700; padding: 2px 6px; text-decoration: underline; }
    .link-btn.danger { color: var(--gov-red); }
    .link-btn.success { color: var(--gov-blue); }

    /* ---- Modal ---- */
    #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); z-index: 1000; justify-content: center; align-items: center; }
    #modal-overlay.active { display: flex; }
    .modal { background: #fff; border-radius: 5px; padding: 28px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
    .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 18px; color: var(--gov-blue); }
    .modal-close { float: right; cursor: pointer; background: none; border: none; font-size: 24px; color: var(--gov-gray); line-height: 1; }
    .modal textarea { min-height: 120px; font-family: monospace; font-size: 14px; margin-bottom: 14px; }
    .modal .confirm-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .modal .confirm-row button { padding: 8px 20px; border-radius: 3px; cursor: pointer; font-weight: 700; font-family: inherit; }
    .modal .btn-cancel { background: var(--gov-gray); color: var(--gov-dark); }
    .modal .btn-confirm { background: var(--gov-blue); color: #fff; }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--gov-gray); }
    .empty-state .big { font-size: 48px; margin-bottom: 12px; }
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>

  /* ===== CONFIG ===== */
  var STORAGE_KEY = 'gov_driving_licence_dashboard';
  var USERS_KEY = 'gov_driving_users';      // who can add records
  var DEFAULT_ADMIN_PW = 'licence2026';     // <-- change this or set on first run
  var authName = localStorage.getItem('gov_dash_name') || 'Admin';

  /* ===== AUTH ===== */
  function checkAuth() {
    var pwd = document.getElementById('auth-password').value;
    var storedPW = localStorage.getItem('gov_dash_pw');
    // First run: set the password and name
    if (!storedPW) {
      if (confirm('First time setup.\n\nSet your dashboard password:')) {
        var newPW = prompt('Enter your password:', DEFAULT_ADMIN_PW);
        if (newPW && newPW.trim()) {
          localStorage.setItem('gov_dash_pw', newPW.trim());
          localStorage.setItem('gov_dash_name', prompt('Enter your name for the dashboard:', authName) || authName);
          authName = localStorage.getItem('gov_dash_name');
          localStorage.setItem('gov_dash_authed', 'true');
          document.getElementById('user-name').textContent = 'Logged in as: ' + authName;
          document.getElementById('user-name').style.display = 'block';
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('main-dash').style.display = 'block';
          renderRecords();
        }
      }
      return;
    }
    if (pwd === storedPW) {
      localStorage.setItem('gov_dash_authed', 'true');
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-dash').style.display = 'block';
      document.getElementById('user-name').textContent = 'Logged in as: ' + authName;
      document.getElementById('user-name').style.display = 'block';
      renderRecords();
    } else {
      document.getElementById('auth-error').classList.add('visible');
    }
  }
  document.getElementById('auth-password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkAuth();
  });

  /* ===== DATA STORAGE ===== */
  function loadData() {
    var stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try { return JSON.parse(stored); } catch(e) {}
    }
    return { users: [], lastUpdated: '' };
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getUsers() { return loadData().users; }

  /* ===== RENDER TABLE ===== */
  function renderRecords() {
    var data = loadData();
    var container = document.getElementById('records-container');
    var users = data.users || [];

    // Stats
    document.getElementById('total-count').textContent = users.length;
    var matchable = 0;
    users.forEach(function(u) { if (u.drivingLicenceNumber) matchable++; });
    document.getElementById('matchable-count').textContent = matchable;

    if (users.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="big">&#128203;</div><p>No records yet. Click "Add Record" to add licence details.</p></div>';
      return;
    }

    var html = '<table>\n';
    html += '<thead><tr>';
    html += '<th>Full Name</th><th>Sex</th><th>DOB</th><th>Address</th>';
    html += '<th>Licence No.</th><th>Status</th><th>Valid From</th><th>Valid To</th><th>Issue No.</th>';
    html += '<th style="width:100px;">Actions</th>';
    html += '</tr></thead>\n<tbody>';

    users.forEach(function(u, idx) {
      var hl = u.drivingLicenceNumber ? ' highlight' : '';
      html += '<tr class="' + hl.trim() + '">';
      html += '<td>' + escapeHTML(u.fullName || '') + '</td>';
      html += '<td>' + escapeHTML(u.sex || '') + '</td>';
      html += '<td>' + escapeHTML(u.dateOfBirth || '') + '</td>';
      html += '<td>' + escapeHTML(u.address || '') + '</td>';
      html += '<td style="font-family:monospace; font-weight:700;">' + escapeHTML(u.drivingLicenceNumber || '') + '</td>';
      html += '<td>' + escapeHTML(u.licenceStatus || '') + '</td>';
      html += '<td>' + escapeHTML(u.licenceValidFrom || '') + '</td>';
      html += '<td>' + escapeHTML(u.licenceValidTo || '') + '</td>';
      html += '<td>' + escapeHTML(u.licenceIssueNumber || '') + '</td>';
      html += '<td><div class="actions">';
      html += '<a class="link-btn success" onclick="editRecord(' + idx + ')">Edit</a>';
      html += '<a class="link-btn danger" onclick="deleteRecord(' + idx + ')">Delete</a>';
      html += '</div></td>';
      html += '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  /* ===== ADDRESS AUTOCOMPLETE ===== */
  (function() {
    var addressInput = document.getElementById('address');
    var dropdown = document.getElementById('address-dropdown');

    if (!addressInput || !dropdown) return;

    function renderSuggestions(query) {
      var q = query.toLowerCase().trim();
      var matches = UK_ADDRESSES.filter(function(addr) {
        return addr.toLowerCase().indexOf(q) !== -1;
      });

      dropdown.innerHTML = '';
      if (!q || matches.length === 0) {
        dropdown.style.display = 'none';
        return;
      }

      matches.forEach(function(addr) {
        var div = document.createElement('div');
        div.className = 'addr-item';
        div.textContent = addr;
        div.addEventListener('click', function() {
          addressInput.value = addr;
          dropdown.style.display = 'none';
          addressInput.dispatchEvent(new Event('input', { bubbles: true }));
        });
        dropdown.appendChild(div);
      });

      dropdown.style.display = 'block';
    }

    addressInput.addEventListener('input', function() {
      renderSuggestions(addressInput.value);
    });

    addressInput.addEventListener('focus', function() {
      if (addressInput.value.trim()) {
        renderSuggestions(addressInput.value);
      }
    });

    document.addEventListener('click', function(e) {
      if (!addressInput.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });
  })();

  /* ===== ADD / EDIT / DELETE ===== */
  document.getElementById('add-user-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var users = getUsers();
    users.push({
      fullName: document.getElementById('fullName').value.trim(),
      sex: document.getElementById('sex').value,
      dateOfBirth: document.getElementById('dateOfBirth').value.trim(),
      address: document.getElementById('address').value.trim(),
      drivingLicenceNumber: document.getElementById('drivingLicenceNumber').value.trim().toUpperCase(),
      licenceStatus: document.getElementById('licenceStatus').value,
      licenceValidFrom: document.getElementById('licenceValidFrom').value.trim(),
      licenceValidTo: document.getElementById('licenceValidTo').value.trim(),
      licenceIssueNumber: document.getElementById('licenceIssueNumber').value.trim()
    });
    saveData({ users: users, lastUpdated: new Date().toISOString() });
    this.reset();
    renderRecords();
    window.dispatchEvent(new CustomEvent('dashboardUpdated'));
  });

  window.editRecord = function(idx) {
    var users = getUsers();
    var u = users[idx];
    if (!confirm('Edit this record?')) return;
    var newName = prompt('Full name:', u.fullName);
    var newSex = prompt('Sex (Male/Female/Prefer not to say):', u.sex);
    var newDOB = prompt('Date of birth:', u.dateOfBirth);
    var newAddr = prompt('Address:', u.address);
    var newLic = prompt('Licence number:', u.drivingLicenceNumber);
    var newStatus = prompt('Licence status:', u.licenceStatus);
    var newFrom = prompt('Valid from:', u.licenceValidFrom);
    var newTo = prompt('Valid to:', u.licenceValidTo);
    var newIssue = prompt('Issue number:', u.licenceIssueNumber);
    if (newName !== null && newName !== '') u.fullName = newName;
    if (newSex !== null && newSex !== '') u.sex = newSex;
    if (newDOB !== null && newDOB !== '') u.dateOfBirth = newDOB;
    if (newAddr !== null && newAddr !== '') u.address = newAddr;
    if (newLic !== null && newLic !== '') u.drivingLicenceNumber = newLic.toUpperCase();
    if (newStatus !== null && newStatus !== '') u.licenceStatus = newStatus;
    if (newFrom !== null && newFrom !== '') u.licenceValidFrom = newFrom;
    if (newTo !== null && newTo !== '') u.licenceValidTo = newTo;
    if (newIssue !== null && newIssue !== '') u.licenceIssueNumber = newIssue;
    saveData({ users: users, lastUpdated: new Date().toISOString() });
    renderRecords();
    window.dispatchEvent(new CustomEvent('dashboardUpdated'));
  };

  window.deleteRecord = function(idx) {
    if (!confirm('Are you sure you want to delete this record?')) return;
    var users = getUsers();
    users.splice(idx, 1);
    saveData({ users: users, lastUpdated: new Date().toISOString() });
    renderRecords();
    window.dispatchEvent(new CustomEvent('dashboardUpdated'));
  };

  /* ===== EXPORT ===== */
  function exportData() {
    var data = loadData();
    var json = JSON.stringify(data, null, 2);
    document.getElementById('export-data').value = json;
    document.getElementById('export-modal').classList.add('active');
  }

  window.copyExportData = function() {
    var ta = document.getElementById('export-data');
    ta.select();
    document.execCommand('copy');
    closeModal();
  };

  window.closeModal = function() {
    document.getElementById('export-modal').classList.remove('active');
  };

  /* ===== NAVIGATION ===== */
  window.showSection = function(sec) {
    document.querySelectorAll('nav a').forEach(function(a) { a.classList.remove('active'); });
    event.target.classList.add('active');
    document.getElementById('add-section').style.display = sec === 'add' ? 'block' : 'none';
    document.getElementById('records-section').style.display = sec === 'records' ? 'block' : 'none';
    if (sec === 'add') {
      document.getElementById('add-form').scrollIntoView({ behavior: 'smooth' });
    }
  };

  /* ===== LISTENER ===== */
  window.addEventListener('dashboardUpdated', renderRecords);

  /* ===== INIT ===== */
  if (localStorage.getItem('gov_dash_authed')) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-dash').style.display = 'block';
  }
  // Show name after first-run setup
  var storedName = localStorage.getItem('gov_dash_name');
  if (storedName) {
    authName = storedName;
    document.getElementById('user-name').textContent = 'Logged in as: ' + authName;
    document.getElementById('user-name').style.display = 'block';
  }
  renderRecords();
</script>
